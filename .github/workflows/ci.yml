# ============================================================================
# xpmath CI  (sub-plan S7)
# ============================================================================
#
# Six lanes, cheapest first. Each answers a different question:
#
#   docs-fresh      Is the generated docs/DOMAINS.md still what the CSVs imply?
#   standalone      Does include/xp/ compile with ZERO Kokkos, on Linux AND
#                   macOS/ARM?  (The macOS leg is the evidence for the upstream
#                   claim that the core is not x86_64-dependent.)
#   monotone-gate   Did any of the 436,080 scored sweep points get LESS accurate?
#   build-and-test  Does the full Kokkos build + the WHOLE ctest suite pass?
#                   "Whole" is asserted, not assumed: the lane installs
#                   libmpfr-dev/libgmp-dev/libmpc-dev and then checks the
#                   registered target count against XPMATH_EXPECTED_TESTS
#                   below. Four targets used to sit behind if(XPMATH_MPFR_FOUND)
#                   and this lane once ran 34 of 38 while reporting "31 tests"
#                   and green. That guard is GONE — MPFR/MPC are now a hard
#                   requirement of tests/CMakeLists.txt, so a runner without
#                   them fails at CONFIGURE time instead of silently shedding
#                   coverage. The count assertion stays anyway: it is the thing
#                   that catches a target moving across a guard, not just a
#                   missing dependency.
#   device-nvcc     Does each of the eight headers compile for a CUDA device?
#   device-hip      Same for HIP/ROCm, plus the gfx90a codegen guard over the
#                   emitted device asm: branch reach (tiers 1-3) and recursive
#                   device stack (tier 4).  UNVERIFIED — see `continue-on-error`.
#                   The UNVERIFIED applies to the ROCm container, not to the
#                   guard: both guards were run locally against ROCm 7.0.2, each
#                   confirmed to fail on the pre-fix source and pass on the fixed.
#
# TOOLCHAIN NOTES THAT MATTER (do not "simplify" these away):
#
#  * KI-3 / C++ STANDARD SPLIT.  Kokkos 5.1.0 REQUIRES C++20 and hard-errors on
#    17 (cmake/kokkos_test_cxx_std.cmake:89).  THIS repo builds at C++17.  Both
#    numbers below are deliberate and must stay different.
#
#  * ORACLE FINGERPRINT.  The monotone gate's reference is MPFR/MPC at 400
#    bits.  It used to be libquadmath, whose transcendental results are a
#    property of the GCC version: gcc 12.2.0, 13.1.0 and 13.3.0 all produced
#    `578322f998a329c8`, gcc 14.1.0 produced `54901e8104607a77`, and the Ubuntu
#    runner produced 54901e… even while reporting g++ 13.3.0.  The committed
#    baseline now records `oracle-fingerprint: 44f18a4a959f6c29`.
#
#    MPFR is correctly rounded, so that value SHOULD be portable across
#    runners and MPFR versions in a way the libquadmath one provably was not.
#    THAT IS AN EXPECTATION, NOT A MEASUREMENT — nobody has yet read the
#    fingerprint off a GitHub runner.  So the gate below still scores PARENT
#    vs HEAD on one runner rather than trusting the committed file, and still
#    REFUSES TO INTERPRET a diff whose fingerprint moved.  If the runner does
#    turn out to reproduce 44f18a4a959f6c29, this lane can be simplified to a
#    single build against the committed baseline; until someone reads it, it
#    cannot.
#
#  * NO __float128 IN A DEVICE TU.  nvcc's device pass walks STL member
#    signatures and rejects std::vector<__float128> even in host-only code.  No
#    flag avoids it.  The device TUs below therefore contain no oracle at all.
#
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A new push to the same branch cancels the previous run; the Kokkos build is
# the expensive part and there is no value in racing two of them.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  KOKKOS_TAG: "5.1.0"

jobs:

  # ==========================================================================
  # 1. Generated-doc freshness.  ~3 s.  Python 3 and the CSVs, nothing else.
  # ==========================================================================
  docs-fresh:
    name: docs freshness (DOMAINS.md)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: validation/check_domains_fresh.sh
        run: |
          python3 --version
          bash validation/check_domains_fresh.sh

  # ==========================================================================
  # 2. Standalone core: no Kokkos, two operating systems, two compiler families.
  #
  # macos-latest is an ARM64 runner using Apple clang (`g++` is a clang++ shim
  # there).  That leg is the point of this job: it is what turns "the core has
  # no Kokkos dependency" into "the core has no x86_64 dependency either".
  #
  # libquadmath is NOT needed here.  The script compiles with an include path of
  # exactly `include/` and no -lquadmath / -fext-numeric-literals — the oracle
  # lives only in the demos and the oracle-scored tests, neither of which this
  # lane touches.  The guard step below asserts that stays true, so if someone
  # later gives a standalone smoke test an oracle dependency the macOS leg says
  # why it broke instead of dying in the linker.
  # ==========================================================================
  standalone:
    name: standalone no-Kokkos (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Show compiler
        run: |
          uname -sm
          g++ --version | head -1

      # `//` comments are stripped first, exactly as step 16 of
      # check_standalone_no_kokkos.sh does for the token "Kokkos": several
      # headers legitimately DISCUSS __float128 in comments (qf_math.hpp:418
      # explains how a 113-bit constant was split into four FP32 words). Naming
      # it in prose is fine; depending on it is not.
      - name: Guard — the standalone lane must stay oracle-free
        shell: bash
        run: |
          bad=0
          for f in include/xp/*.hpp tests/standalone/*.cpp; do
            if sed 's://.*::' "$f" | grep -nE '__float128|quadmath' ; then
              echo "::error file=${f}::references __float128/quadmath in code"
              bad=1
            fi
          done
          if [ "$bad" -ne 0 ]; then
            echo "::error::libquadmath is x86_64-glibc only, so this lane -- and"
            echo "::error::the portability claim it backs -- cannot hold if the"
            echo "::error::standalone core depends on it."
            exit 1
          fi
          echo "ok - no oracle dependency in include/xp/ or tests/standalone/"

      - name: scripts/check_standalone_no_kokkos.sh
        run: bash scripts/check_standalone_no_kokkos.sh

  # ---------------------------------------------------------------------------
  # The build itself, with Kokkos switched off.
  #
  # The `standalone` lane above proves the HEADERS need no Kokkos. This one
  # proves the BUILD does not either -- which was false until XPMATH_WITH_KOKKOS
  # existed: find_package(Kokkos REQUIRED) gated the header-only export, its
  # install rules and the whole test suite, so `sweep_accuracy` -- which links
  # no Kokkos and is the binary behind BOTH correctness gates -- could not be
  # built on a machine without it.
  #
  # Without a lane, that decoupling regresses the first time someone moves a
  # target outside the guard and only ever configures with Kokkos on. Measured
  # locally before this lane was written: 20/20 in 164 s; 21/21 in 169 s since
  # build_provenance joined the Kokkos-free set.
  # ---------------------------------------------------------------------------
  no-kokkos-build:
    name: build + ctest with XPMATH_WITH_KOKKOS=OFF
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install g++-13 and the oracle libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-13 libmpfr-dev libgmp-dev libmpc-dev

      - name: Configure with no Kokkos anywhere
        env:
          CXX: g++-13
        run: |
          cmake -S . -B build-nokokkos \
                -DCMAKE_BUILD_TYPE=Release \
                -DXPMATH_WITH_KOKKOS=OFF

      # A Kokkos that is merely unused is not the same as one that is absent.
      # If any target still links it, this fails at build time rather than
      # quietly succeeding because the runner happens to have none installed.
      - name: Build
        run: cmake --build build-nokokkos -j"$(nproc)"

      - name: Assert the Kokkos-free suite is the expected size
        run: |
          set -euo pipefail
          expected=21
          actual=$(ctest --test-dir build-nokokkos -N | awk '/^Total Tests: /{print $3}')
          echo "registered without Kokkos: ${actual} (expected ${expected})"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::${actual} targets registered without Kokkos, expected ${expected}."
            echo "::error::A target moved across the XPMATH_WITH_KOKKOS guard."
            ctest --test-dir build-nokokkos -N
            exit 1
          fi

      - name: ctest
        run: ctest --test-dir build-nokokkos -j4 --timeout 1800 --output-on-failure

  # ==========================================================================
  # 3. THE MONOTONE GATE.  The single most valuable regression check here.
  #
  # Rebuilds every one of the 436,080 scored sweep points against an MPFR/MPC
  # oracle at 400 bits and fails if ANY point's digit count DECREASED.  The
  # per-op tolerance tables in ctest gate on a mean against a threshold, so they
  # cannot see a fix that buys 30 digits in one op by quietly spending 2 in
  # another.  This can.
  #
  # Measured on the toolchain of record (gcc 13.3.0): 13 s to compile and 35 s
  # to run the full sweep, TWICE -- parent and HEAD -- so budget ~100 s.  It was
  # 7 s and 4 s under the libquadmath oracle; correct rounding at 400 bits is
  # ~8x the arithmetic and that is the price of the reference being right.
  # Still cheap enough to run on every push.
  # ==========================================================================
  monotone-gate:
    name: monotone accuracy gate (parent vs HEAD)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2          # need HEAD^ to score the parent commit

      - name: Install g++-13 and the oracle libraries
        run: |
          # Third-party apt sources shipped with the runner image (Chrome,
          # Microsoft) are not used by this project and have broken the build
          # before with "Hash Sum mismatch" on dl.google.com. Remove them so an
          # unrelated mirror cannot fail this lane, then retry once for genuine
          # transient network errors.
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*chrome*.list \
                     /etc/apt/sources.list.d/*microsoft*.list || true
          sudo apt-get update || (sleep 15 && sudo apt-get update)
          # libmpfr-dev/libgmp-dev/libmpc-dev are NOT optional here any more.
          # sweep_accuracy.cpp #errors without XPMATH_HAVE_MPFR, and the two
          # hand-compiles below are the whole lane. This install line was the
          # last thing in CI still assuming a libquadmath oracle: it used to
          # fetch g++-13 and nothing else.
          sudo apt-get install -y g++-13 libmpfr-dev libgmp-dev libmpc-dev
          g++-13 -dumpfullversion
      # WHY NOT COMPARE AGAINST validation/sweep/sweep_baseline.csv.gz?
      #
      # The historical reason was that the oracle was libquadmath and its
      # transcendental results are a property of the libquadmath BUILD -- not,
      # as first assumed, of the gcc version. Measured in the first CI run: this
      # runner reports g++ 13.3.0, the same version as the toolchain of record,
      # and still produced 54901e8104607a77 against the baseline's
      # 578322f998a329c8. JLSE is x86_64-suse-linux with glibc 2.38; the runner
      # is Ubuntu 24.04 with glibc 2.39. No pinnable gcc version closed that gap.
      #
      # The oracle is MPFR/MPC now, and correctly rounded results should not
      # vary that way -- but SHOULD is not MEASURED, and nobody has read a
      # fingerprint off this runner yet. Until someone does, keep the structure
      # that does not depend on the answer: compare the PARENT COMMIT against
      # HEAD, both scored on THIS runner with THIS MPFR. Whatever the oracle is,
      # it is identical on both sides and cancels exactly, and the question CI
      # actually needs answered -- "did this commit make any of the 436,080
      # points worse?" -- is answered without depending on a reference recorded
      # somewhere else.
      #
      # The committed baseline remains the reference for work done on the
      # toolchain of record; it is reported below, non-gating, for continuity.
      - name: Score the PARENT commit (same runner, same oracle)
        id: parent
        shell: bash
        run: |
          set -euo pipefail
          if ! git rev-parse --verify -q HEAD^ >/dev/null; then
            echo "no parent commit (first commit or shallow history); skipping gate"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git worktree add --detach /tmp/parent HEAD^
          if [ ! -f /tmp/parent/scripts/sweep_accuracy.cpp ]; then
            echo "parent commit predates scripts/sweep_accuracy.cpp; skipping gate"
            echo "skipped=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # THE PARENT IS COMPILED FOR EITHER SHAPE, ON PURPOSE. Across the
          # commit that made MPFR the only oracle, HEAD^ is the last source that
          # still had a libquadmath arm; on every later commit it will not.
          # -DXPMATH_HAVE_MPFR=1 is what the new source demands and the old one
          # merely honours; -lquadmath is what the old source needs and the new
          # one does not call. Linking a library nothing calls costs a DT_NEEDED
          # entry in a throwaway binary and buys a lane that does not have to be
          # edited twice. It is NOT a licence to reintroduce -lquadmath on the
          # HEAD line below -- that one is an acceptance check.
          g++-13 -std=c++17 -fext-numeric-literals -O2 -DXPMATH_HAVE_MPFR=1 \
                 -I/tmp/parent/include /tmp/parent/scripts/sweep_accuracy.cpp \
                 -lmpc -lmpfr -lgmp -lquadmath -o /tmp/sweep_parent
          # --oracle=mpfr narrows the gap across the transition but DOES NOT
          # CLOSE IT, and the claim that it did is now measured false. On any
          # post-transition parent it is an exact no-op -- verified: the same
          # binary with and without the flag yields the identical fingerprint
          # 44f18a4a959f6c29 and a 436,080-row comparison with zero drift. On a
          # PRE-transition parent it selects that source's OWN MPFR arm, which
          # is not the arm HEAD uses: the oracle commit also rewrote mpfr_to_q,
          # whose clamped scale had been turning exp/sinh/cosh references above
          # 2^1000001 into NaN. So the two sides still disagree, and the flag
          # cannot fix it.
          #
          # MEASURED on PR #26, the one PR that crosses the transition. NOTE
          # THAT ON A PR `HEAD^` IS THE BASE BRANCH, not the previous commit on
          # the branch -- Actions checks out an ephemeral merge commit -- so
          # the parent here was `main` (8cfeae7, pre-transition, fingerprint
          # 735ef724fa491ebd) against HEAD's 44f18a4a959f6c29. Result: 0
          # decreased, 0 state moved, 0 bound drift, and 20 rows of DIGIT drift
          # (DD and FF real `exp`, 0.00 -> 31.00 / 14.00) which are the
          # mpfr_to_q fix becoming visible. Exit 3, because the fingerprint arm
          # below drops unattributable IMPROVEMENTS but `drifted` is evaluated
          # regardless of it.
          #
          # THIS IS A ONE-TIME CONDITION AND IT SELF-HEALS: once the oracle
          # commit is on main, every later PR compares MPFR against MPFR.
          #
          # IT COST ONE MORE RED RUN THAN THAT SENTENCE IMPLIES, so it is worth
          # saying exactly: the MERGE'S OWN PUSH RUN TO main FAILED TOO. A merge
          # commit's `HEAD^` is its FIRST PARENT, which is the pre-merge main --
          # 8cfeae7 here, still pre-oracle-switch -- so the push run for
          # 9960df0 reproduced the identical 20-row digit drift. Measured, not
          # predicted. The first commit whose `HEAD^` contains the oracle switch
          # is the first one this lane can pass. Do not
          # "fix" it by relaxing the gate under schedule pressure -- the comment
          # block in sweep_accuracy.cpp records getting this exact call wrong
          # twice. If it is ever worth fixing properly, the narrow change is to
          # let a fingerprint mismatch drop drift_digits the way it already
          # drops improvements, leaving drift_bound and state_moved gating, and
          # to ship a poison self-test proving the relaxed gate can still fail.
          /tmp/sweep_parent --oracle=mpfr --out /tmp/parent_baseline.csv --quiet > /dev/null
          echo "parent  $(git rev-parse --short HEAD^)  fingerprint: \
            $(sed -n 's/^# oracle-fingerprint: //p' /tmp/parent_baseline.csv | head -1)"
          echo "skipped=false" >> "$GITHUB_OUTPUT"
      - name: MONOTONE GATE — no point may lose accuracy vs the parent commit
        if: steps.parent.outputs.skipped != 'true'
        shell: bash
        run: |
          set -euo pipefail
          # NO -lquadmath, and that is load-bearing rather than tidy. The two
          # acceptance checks in the header of scripts/sweep_accuracy.cpp say
          # the shipped binary links and calls nothing from libquadmath;
          # spelling it here would let this lane stay green through a change
          # that reintroduced a dependency on it. __float128 still works --
          # its arithmetic is libgcc's (__addtf3), and the elementary
          # functions this TU reaches for are glibc's *f128 entry points.
          g++-13 -std=c++17 -fext-numeric-literals -O2 -DXPMATH_HAVE_MPFR=1 \
                 -Iinclude scripts/sweep_accuracy.cpp \
                 -lmpc -lmpfr -lgmp -o /tmp/sweep_head
          if ldd /tmp/sweep_head | grep -i quadmath; then
            echo "::error::sweep_accuracy pulled in libquadmath; see the two"
            echo "::error::acceptance checks in scripts/sweep_accuracy.cpp."
            exit 1
          fi
          echo "HEAD    $(git rev-parse --short HEAD)"
          # Exit 5 is IMPROVEMENT DRIFT, and this lane is the one place it is
          # not a defect. The parent baseline is regenerated from the parent's
          # own source on every run (above), so there is no durable record for
          # an improvement to invalidate -- an improvement here is the commit
          # doing its job. ctest's sweep_monotone_gate compares against the
          # COMMITTED baseline, where the same signal means the file is stale
          # and a re-baseline commit is owed; that lane keeps failing on 5.
          #
          # Captured explicitly rather than `|| true`, which would swallow exit
          # 1 (a real regression) as well. `set -e` is on, so the capture has to
          # be in the same statement as the call.
          rc=0
          /tmp/sweep_head --baseline /tmp/parent_baseline.csv || rc=$?
          if [ "$rc" -eq 5 ]; then
            echo "::notice::exit 5 — rows improved against the parent. Expected"
            echo "::notice::on an accuracy fix; nothing to re-record in this lane."
          elif [ "$rc" -eq 6 ]; then
            # Exit 6 is COVERAGE GROWTH (#21): this commit scores points the
            # parent did not have. Same reasoning as 5, and for the same
            # structural reason -- the parent baseline is regenerated from the
            # parent's own source above, so new points have nothing durable to
            # invalidate. Widening the grid is the one change the keyed
            # matching was introduced to permit; failing it here would leave no
            # way to land it. ctest's sweep_monotone_gate still fails on 6,
            # where the baseline is a committed artifact and a re-baseline
            # commit is owed.
            echo "::notice::exit 6 — this commit scores grid points the parent"
            echo "::notice::did not. Coverage grew; nothing to re-record here."
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
      # Informational only. A mismatch here is expected on any runner whose
      # libquadmath differs from the toolchain of record, and says nothing about
      # this commit. Never gate on it; never re-baseline from CI.
      - name: Report against the committed baseline (non-gating)
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          base_fp=$(zcat validation/sweep/sweep_baseline.csv.gz | sed -n 's/^# oracle-fingerprint: //p' | head -1)
          echo "committed baseline fingerprint : ${base_fp}"
          if [ -x /tmp/sweep_head ]; then
            /tmp/sweep_head --baseline validation/sweep/sweep_baseline.csv.gz || true
          fi
          echo "(informational: a differing oracle makes this diff meaningless)"

  # ==========================================================================
  # 4. Full build + ctest.  The expensive lane; Kokkos dominates the wall time,
  #    so its INSTALL TREE is cached and rebuilt only when the key changes.
  #
  #    Cache key deliberately includes the CMake flags: flipping LIBQUADMATH or
  #    the C++ standard must invalidate, or the lane silently tests the wrong
  #    Kokkos.
  # ==========================================================================
  build-and-test:
    name: Kokkos build + ctest (full suite, MPFR arm included)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          # Third-party apt sources shipped with the runner image (Chrome,
          # Microsoft) are not used by this project and have broken the build
          # before with "Hash Sum mismatch" on dl.google.com. Remove them so an
          # unrelated mirror cannot fail this lane, then retry once for genuine
          # transient network errors.
          sudo rm -f /etc/apt/sources.list.d/*google*.list \
                     /etc/apt/sources.list.d/*chrome*.list \
                     /etc/apt/sources.list.d/*microsoft*.list || true
          sudo apt-get update || (sleep 15 && sudo apt-get update)
          # libmpfr-dev/libgmp-dev/libmpc-dev are what make THE oracle exist --
          # not an arm of it, the whole of it. MPC is the complex half and is
          # required by the same rule: the oracle is whole-library or it is
          # unavailable.
          #
          # These were optional once, behind XPMATH_MPFR_FOUND, and the failure
          # mode is worth keeping written down: without them four targets --
          # trig_reduction_test, trig_reduction_selftest, oracle_conv_test and
          # oracle_conv_selftest -- were never registered, so CI validated the
          # sweep against a reference whose conversions it never checked, and
          # reported green. tests/CMakeLists.txt now FATAL_ERRORs instead, which
          # turns a missing package here into a configure failure rather than
          # silent lost coverage.
          sudo apt-get install -y g++-13 cmake ninja-build libmpfr-dev libgmp-dev libmpc-dev
          g++-13 -dumpfullversion
          cmake --version | head -1

      - name: Cache Kokkos install tree
        id: kokkos-cache
        uses: actions/cache@v4
        with:
          path: ~/kokkos-install
          # Bump the trailing integer to force a rebuild. v1→v2 reflects the
          # removal of -DKokkos_ENABLE_LIBQUADMATH=ON, which invalidates the cached
          # tree.
          key: kokkos-${{ env.KOKKOS_TAG }}-serial-noquadmath-cxx20-gcc13-ubuntu24-v2

      - name: Build Kokkos ${{ env.KOKKOS_TAG }} (Serial)
        if: steps.kokkos-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "${KOKKOS_TAG}" \
            https://github.com/kokkos/kokkos.git /tmp/kokkos-src

          # This step used to copy patches/kokkos_complex_quad_math.hpp into the
          # Kokkos SOURCE tree, because the four complex demos included
          # impl/Kokkos_ComplexQuadPrecisionMath.hpp for their __complex128
          # accuracy columns and that header is not upstream in Kokkos.  B3
          # deleted the columns and the patch with them; the demos are timing and
          # smoke only now.  The LIBQUADMATH TPL is gone: the one consumer was
          # kokkos_ep_bench_cost (which benchmarked backends against __float128),
          # and it is deleted.

          # KI-3: Kokkos itself REQUIRES C++20.  This is not the standard the
          # consuming repo is built at (see the next step, which uses 17).
          cmake -S /tmp/kokkos-src -B /tmp/kokkos-build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${HOME}/kokkos-install" \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_STANDARD=20 \
            -DKokkos_ENABLE_SERIAL=ON
          cmake --build /tmp/kokkos-build -j"$(nproc)" --target install

      # KI-3, other half: THIS repo is C++17.  Do not unify the two numbers.
      - name: Configure xpmath (C++17, -O3 -DNDEBUG)
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_STANDARD=17 \
            -DCMAKE_CXX_COMPILER=g++-13 \
            -DCMAKE_CXX_FLAGS="-O3 -DNDEBUG" \
            -DCMAKE_PREFIX_PATH="${HOME}/kokkos-install"

      - name: Build
        run: cmake --build build -j"$(nproc)"

      # The regex is anchored and forbids underscores deliberately. libquadmath
      # exports exactly 92 symbols ending in `q` and every one of them is bare
      # lowercase (`expq`, `cpowq`); a looser `[a-z0-9_]+q` also matches GMP's
      # `__gmpz_fdiv_q`, which MPFR pulls into the oracle binaries and which has
      # nothing to do with libquadmath. MEASURED on this build: the anchored form
      # matches 92/92 libquadmath exports and 0 symbols from gmp, mpfr, mpc,
      # libm, libstdc++ or libc.
      #
      # `ldd` is the WRONG check and would look like a failure: a Kokkos built
      # with the LIBQUADMATH TPL puts -lquadmath on every Kokkos-linked target's
      # link line and leaves a DT_NEEDED with not one symbol bound. Only the
      # undefined-symbol check means anything. See tests/CMakeLists.txt lines
      # 50-65 for the full explanation.
      - name: No built binary calls libquadmath
        run: |
          set -euo pipefail
          bins=$(find build -type f -executable -not -name '*.cmake' -not -path '*/CMakeFiles/*')
          test -n "$bins" || { echo "::error::no binaries found under build/ - guard did not run"; exit 1; }
          echo "scanned $(echo "$bins" | wc -l) binaries"
          fail=0
          for b in $bins; do
            if nm -D --undefined-only "$b" 2>/dev/null | grep -qE ' (c?[a-z][a-z0-9]*q)$'; then
              echo "::error::$b has undefined libquadmath symbols"
              nm -D --undefined-only "$b" | grep -E ' (c?[a-z][a-z0-9]*q)$'
              fail=1
            fi
          done
          exit $fail

      # A SUITE THAT SHRINKS SILENTLY IS A SUITE THAT PASSES SILENTLY.
      #
      # Optional dependencies gate targets with if(...), and a missing one
      # removes coverage without removing green. That is how this lane came to
      # run 34 targets while its own name said 31 and nothing anywhere
      # disagreed. The count is now asserted against the number registered by a
      # configure that has every optional dependency present.
      #
      #
      # When you deliberately add or remove a ctest target, this number changes
      # with it, in the same commit. That is the point: the count is part of the
      # contract, not a fact about the runner.
      - name: Assert the full suite is registered
        run: |
          set -euo pipefail
          expected=49
          actual=$(ctest --test-dir build -N | awk '/^Total Tests: /{print $3}')
          echo "registered targets: ${actual} (expected ${expected})"
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::ctest registered ${actual} targets, expected ${expected}."
            echo "::error::A gated target is missing -- most likely an optional"
            echo "::error::dependency (MPFR/GMP) did not install, which removes"
            echo "::error::coverage while leaving this lane green. Refusing to"
            echo "::error::report a pass over a smaller suite."
            ctest --test-dir build -N
            exit 1
          fi

      - name: ctest
        run: ctest --test-dir build -j4 --timeout 1800 --output-on-failure

      - name: Upload ctest log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ctest-log
          path: build/Testing/Temporary/LastTest.log
          if-no-files-found: ignore

  # ==========================================================================
  # 5. Device compile lanes (CUDA).  No GPU is used or needed — `nvcc -c`
  #    produces the device code and stops.
  #
  #    ONE TU PER HEADER, not one TU for all eight.  Measured locally: the
  #    combined TU had not finished after 10 minutes, while the per-header TUs
  #    take 8 s (dd_math) to a few minutes (qf/tf).  The split also gives a
  #    per-header verdict instead of one opaque failure.
  #
  #    The TUs are generated here rather than committed because they exist only
  #    to force device instantiation; there is nothing to maintain in them.
  # ==========================================================================
  device-nvcc:
    name: nvcc device compile (${{ matrix.hdr }})
    runs-on: ubuntu-24.04
    container: nvidia/cuda:12.9.2-devel-ubuntu24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - {hdr: dd_math,    kind: real,    type: DoubleDouble,        scalar: double, lead: hi}
          - {hdr: ff_math,    kind: real,    type: FloatFloat,          scalar: float,  lead: hi}
          - {hdr: qf_math,    kind: real,    type: QuadFloat,           scalar: float,  lead: f0}
          - {hdr: tf_math,    kind: real,    type: TripleFloat,         scalar: float,  lead: f0}
          - {hdr: dd_complex, kind: complex, type: DoubleDoubleComplex, real: DoubleDouble, scalar: double, lead: hi}
          - {hdr: ff_complex, kind: complex, type: FloatFloatComplex,   real: FloatFloat,   scalar: float,  lead: hi}
          - {hdr: qf_complex, kind: complex, type: QuadFloatComplex,    real: QuadFloat,    scalar: float,  lead: f0}
          - {hdr: tf_complex, kind: complex, type: TripleFloatComplex,  real: TripleFloat,  scalar: float,  lead: f0}
    steps:
      - name: Install git (the CUDA image is minimal)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          nvcc --version | tail -2
          g++ -dumpfullversion

      - name: Generate the device TU
        shell: bash
        run: |
          set -euo pipefail
          # NOTE: no <vector> and no __float128 anywhere below.  nvcc's device
          # pass walks STL member signatures and rejects std::vector<__float128>
          # even in host-only code; the host oracle stays in its own TU.
          if [ "${{ matrix.kind }}" = "real" ]; then
            cat > /tmp/tu.cu <<'EOF'
          #include <xp/HEADER.hpp>
          using T = xp::TYPE;
          using S = SCALAR;
          __device__ void touch(S x, S y, S* out) {
              T a{x}, b{y};
              T r = a + b; r = r - b; r = r * b; r = r / (b + T{S(2)});
              r = r + xp::sqrt(xp::abs(a)) + xp::exp(b) + xp::log(xp::abs(a) + T{S(1)})
                    + xp::exp2(b) + xp::exp10(b) + xp::expm1(b)
                    + xp::log2(xp::abs(a) + T{S(1)}) + xp::log10(xp::abs(a) + T{S(1)})
                    + xp::log1p(xp::abs(b))
                    + xp::sin(a) + xp::cos(a) + xp::tan(b)
                    + xp::asin(b) + xp::acos(b) + xp::atan(a)
                    + xp::sinh(b) + xp::cosh(b) + xp::tanh(a)
                    + xp::acosh(xp::abs(a) + T{S(1)}) + xp::asinh(a) + xp::atanh(b)
                    + xp::pow(xp::abs(a) + T{S(1)}, b) + xp::hypot(a, b)
                    + xp::fmod(a, b + T{S(1)}) + xp::remainder(a, b + T{S(1)})
                    + xp::copysign(a, b) + xp::fmax(a, b) + xp::fmin(a, b) + xp::fdim(a, b)
                    + xp::fma(a, b, a) + xp::ceil(a) + xp::floor(a) + xp::round(a) + xp::trunc(a)
                    + xp::atan2(a, b) + xp::negate(a) + xp::multiply_scalar(a, S(2))
                    + xp::divide_scalar(a, S(2)) + xp::pow_int(a, 3);
              T s, c;   xp::sincos(a, s, c);       r = r + s + c;
              T sh, ch; xp::sinhcosh(b, sh, ch);   r = r + sh + ch;
              *out = r.LEAD;
          }
          __global__ void k(const S* in, S* o) { touch(in[0], in[1], o); }
          EOF
          else
            cat > /tmp/tu.cu <<'EOF'
          #include <xp/HEADER.hpp>
          using C = xp::TYPE;
          using T = xp::REALTYPE;
          using S = SCALAR;
          __device__ void touch(S x, S y, S* out) {
              C z{T{x}, T{y}}, w{T{y}, T{x}};
              C r = z + w; r = r - w; r = r * w; r = r / w;
              r = r + xp::sqrt(z) + xp::exp(z) + xp::log(z) + xp::log10(z) + xp::log1p(z)
                    + xp::sin(z) + xp::cos(z) + xp::tan(z)
                    + xp::asin(z) + xp::acos(z) + xp::atan(z)
                    + xp::sinh(z) + xp::cosh(z) + xp::tanh(z)
                    + xp::asinh(z) + xp::acosh(z) + xp::atanh(z)
                    + xp::pow(z, w) + xp::conj(z) + xp::polar(T{x}, T{y});
              *out = xp::abs(r).LEAD;
          }
          __global__ void k(const S* in, S* o) { touch(in[0], in[1], o); }
          EOF
          fi
          sed -i -e 's/HEADER/${{ matrix.hdr }}/' \
                 -e 's/xp::TYPE/xp::${{ matrix.type }}/' \
                 -e 's/xp::REALTYPE/xp::${{ matrix.real }}/' \
                 -e 's/= SCALAR;/= ${{ matrix.scalar }};/' \
                 -e 's/\.LEAD;/.${{ matrix.lead }};/' /tmp/tu.cu
          cat /tmp/tu.cu

      - name: nvcc -c (compile only, sm_80)
        # Container jobs default to `sh -e {0}`; `time` is a bash keyword and
        # dash does not have it (first CI run: "time: not found", exit 127).
        shell: bash
        run: |
          time nvcc -std=c++17 -c -arch=sm_80 -Iinclude /tmp/tu.cu -o /tmp/tu.o

  # ==========================================================================
  # 6. Device compile lane (HIP).  UNVERIFIED BY CONSTRUCTION.
  #
  #    No hipcc exists on the machine this workflow was authored on, so unlike
  #    every other lane here nothing about this one was executed before it was
  #    committed.  It is therefore `continue-on-error: true`: it reports, it
  #    does not gate.  Once a run confirms the image and the flags, delete that
  #    line and the lane becomes real.
  #
  #    UPDATE.  The two steps below HAVE since been run by hand against ROCm
  #    7.0.2 / gfx90a on a machine with hipcc (14 s for the compile; the guard
  #    exits 0 on the current tree and 1 on the pre-fix one).  What remains
  #    unverified is the GitHub side: the `rocm/dev-ubuntu-24.04:latest`
  #    container, its hipcc version, and whether a hosted runner has the disk
  #    and time for it.  `continue-on-error: true` therefore STAYS -- the
  #    branch-reach guard cannot gate merges from inside a lane whose
  #    environment has never once executed, because the first red would be
  #    indistinguishable from a broken image.  Delete the line after the first
  #    green run and the guard becomes gating along with the rest of the lane.
  # ==========================================================================
  device-hip:
    name: hipcc device compile (UNVERIFIED, non-gating)
    runs-on: ubuntu-24.04
    container: rocm/dev-ubuntu-24.04:latest
    continue-on-error: true
    steps:
      - name: Install git (the ROCm image is minimal)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          export PATH=/opt/rocm/bin:$PATH
          hipcc --version | head -5

      - name: hipcc -c over all eight headers
        shell: bash
        run: |
          set -euo pipefail
          export PATH=/opt/rocm/bin:$PATH
          cat > /tmp/hip_tu.hip <<'EOF'
          // Compile-only HIP smoke.  No __float128, no <vector>.
          #include <hip/hip_runtime.h>
          #include <xp/dd_math.hpp>
          #include <xp/dd_complex.hpp>
          #include <xp/ff_math.hpp>
          #include <xp/ff_complex.hpp>
          #include <xp/qf_math.hpp>
          #include <xp/qf_complex.hpp>
          #include <xp/tf_math.hpp>
          #include <xp/tf_complex.hpp>
          __global__ void k(const double* in, double* out) {
              xp::DoubleDouble a{in[0]}, b{in[1]};
              xp::FloatFloat   c{(float)in[0]};
              xp::QuadFloat    d{(float)in[0]};
              xp::TripleFloat  e{(float)in[0]};
              xp::DoubleDoubleComplex z{a, b};
              xp::FloatFloatComplex   zf{c, c};
              xp::QuadFloatComplex    zq{d, d};
              xp::TripleFloatComplex  zt{e, e};
              out[0] = xp::sqrt(xp::exp(a) + b).hi
                     + (double)xp::sqrt(xp::exp(c)).hi
                     + (double)xp::sqrt(xp::exp(d)).f0
                     + (double)xp::sqrt(xp::exp(e)).f0
                     + xp::abs(xp::log(z)).hi
                     + (double)xp::abs(xp::log(zf)).hi
                     + (double)xp::abs(xp::log(zq)).f0
                     + (double)xp::abs(xp::log(zt)).f0
                     // The reflecting functions, so the tier-4 self-call guard
                     // below has something to judge.  asinh/tanh/tgamma each
                     // used to reflect by calling THEMSELVES; on gfx90a that
                     // cost the kernel its static stack bound.  Without these
                     // calls the TU emits no recursive callee and tier 4 is
                     // vacuously clean.  See docs/ROCM_RECURSIVE_DEVICE_STACK.md.
                     + xp::asinh(a).hi
                     + (double)xp::asinh(c).hi
                     + (double)xp::asinh(d).f0
                     + (double)xp::asinh(e).f0
                     + xp::tanh(a).hi
                     + (double)xp::tanh(c).hi
                     + (double)xp::tanh(d).f0
                     + (double)xp::tanh(e).f0
                     + xp::tgamma(a).hi
                     + (double)xp::tgamma(c).hi;
          }
          EOF
          # --save-temps=obj keeps the device .s next to the object so the
          # branch-reach guard below has something to read.  It is the reason
          # this step writes into a directory rather than straight to /tmp.
          mkdir -p /tmp/hipsave
          time hipcc -std=c++17 --offload-arch=gfx90a --save-temps=obj \
               -c -Iinclude /tmp/hip_tu.hip -o /tmp/hipsave/hip_tu.o
          ls -la /tmp/hipsave/*-amdgcn-amd-amdhsa-*.s

      # ----------------------------------------------------------------------
      # gfx90a device-codegen guard.  TWO defects, one pass.
      #
      # (1) BRANCH REACH, tiers 1-3.  See docs/ROCM_BRANCH_RELAXATION_BUG.md.
      # LLVM's BranchRelaxation scavenges s[30:31] -- the live return-address
      # pair -- when it expands an out-of-range branch inside a device CALLEE,
      # so the callee's own `s_setpc_b64 s[30:31]` return jumps back into its
      # body.  Confirmed on ROCm 7.0.2 / gfx90a.  The library's defence is
      # XPMATH_NOINLINE_FUNCTION keeping every callee under the +/-131,068 B
      # S_BRANCH reach; this step is what stops that regressing.
      #
      # (2) RECURSIVE DEVICE STACK, tier 4.  See
      # docs/ROCM_RECURSIVE_DEVICE_STACK.md.  A device self-call sets
      # uses_dynamic_stack and provisions nothing, charging the whole
      # non-inlined chain to the HIP runtime's 1024 B default per-thread
      # allowance.  Measured on MI250X: xp::asinh overran it in all four
      # backends.  Tier 4 is zero-tolerance and was executed both ways locally
      # before it was committed -- exit 1 on 6ddcb2d's headers (9 self-calls:
      # asinh x4, tanh x3, tgamma x2), exit 0 on the de-recursed ones.
      #
      # These two mitigations PULL AGAINST EACH OTHER, which is why they share a
      # guard: the noinline that fixes (1) deepens the frame chain that (2)
      # cannot afford.  Any future change to either must be re-measured against
      # both tiers, not just its own.
      #
      # SCOPE, HONESTLY.  This TU has one kernel, so with everything inlined
      # the bulk would land in a kernel, which is exempt (kernels end in
      # s_endpgm and never hold a return address).  What the step really
      # watches is the ~25 library callees that XPMATH_NOINLINE_FUNCTION
      # creates -- measured locally on this exact TU, the largest is
      # xp::atan2(TripleFloat) at 75,553 B, i.e. 77% of the 98,304 B drift
      # gate.  It is a real tripwire on those, not a whole-program audit.  The
      # authoritative run is the lint over a full device build of the sweep,
      # which is not something a GitHub runner can produce.
      #
      # This step was executed locally against ROCm 7.0.2 before it was
      # committed (unlike the rest of this lane), both ways: exit 0 on the
      # fixed build, exit 1 on the pre-fix one.
      # ----------------------------------------------------------------------
      - name: gfx90a device-codegen guard on the emitted device asm
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/xpm_lint_device_asm.sh /tmp/hipsave
